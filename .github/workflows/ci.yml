name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Scoped to the new React site. A bare `tsc --noEmit` is NOT run here:
      # the legacy p5 sources (sketch.ts, tiles.ts, utils.ts) carry 32
      # pre-existing @types/p5 errors. See web/tsconfig.site.json.
      - name: Typecheck (site)
        run: npm run typecheck:site
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      # playwright.config.ts has no `webServer`, so the production preview is
      # started here and polled until it answers before the specs run.
      - name: Run e2e against the production build
        working-directory: web
        run: |
          npm run preview &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/Spectre/ >/dev/null 2>&1; then
              echo "preview up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8081/Spectre/ >/dev/null
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
