<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/app.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #main-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .sidebar { position: absolute; top: 10px; background-color: rgba(240, 240, 240, 0.9); padding: 10px; border: 1px solid #ccc; border-radius: 5px; max-height: 95vh; overflow-y: auto; }
        #controls-sidebar { left: 10px; width: 150px; }
        #palette-sidebar { right: 10px; width: 250px; }
        #palette-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #tile-palette { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .tile-canvas-container { border: 1px solid black; }
        #palette-controls { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
        .control-row { display: flex; align-items: center; gap: 2px; }
        .control-row span { font-size: 12px; width: 35px; }
        .color-box-container { position: relative; }
        .color-box { width: 20px; height: 20px; padding: 0; border: 1px solid #ccc; cursor: pointer; }
        .color-box.update-all { border: 2px solid black; }
        .clear-button { width: 22px; height: 22px; padding: 0; border: 1px solid #ccc; cursor: pointer; background-color: #f8f8f8; }
        .tooltip { visibility: hidden; width: 120px; background-color: #555; color: #fff; text-align: center; border-radius: 6px; padding: 5px 0; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -60px; opacity: 0; transition: opacity 0.3s; }
        .color-box-container:hover .tooltip { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div id="main-content"></div>
    <div id="controls-sidebar" class="sidebar">
        <h4>Controls</h4>
        <div id="controls-container"></div>
        <hr>
        <h4>Drawing</h4>
        <div id="drawing-controls-container"></div>
    </div>
    <div id="palette-sidebar" class="sidebar">
        <div id="palette-header">
            <h4>Tile Palette</h4>
            <button id="clear-all-button">Clear All</button>
        </div>
        <div id="tile-palette"></div>
        <div id="palette-controls"></div>
    </div>
</body>
</html>
